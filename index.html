<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alex Chen | Cybersecurity Learning Journey</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['DM Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            cyber: {
              dark: '#05080f',
              deeper: '#030508',
              slate: '#0a0f1a',
              cyan: '#00e5cc',
              teal: '#14a89a',
              amber: '#f5a623',
              coral: '#ff6b6b',
              blue: '#4f9cff',
            }
          }
        }
      }
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { font-family: 'DM Sans', sans-serif; overflow-x: hidden; }
    
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #00e5cc; border-radius: 10px; }
    .light ::-webkit-scrollbar-thumb { background: #0d9488; }
    
    .gradient-text {
      background: linear-gradient(135deg, #00e5cc 0%, #14a89a 50%, #4f9cff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .gradient-underline {
      background: linear-gradient(90deg, #00e5cc, #14a89a) no-repeat left bottom;
      background-size: 100% 2px;
      padding-bottom: 2px;
    }
    
    .glow-soft { box-shadow: 0 0 60px rgba(0, 229, 204, 0.1); }
    .glow-amber { box-shadow: 0 0 40px rgba(245, 166, 35, 0.1); }
    
    .glass {
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.04);
    }
    .light .glass {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(0, 0, 0, 0.05);
    }
    
    .glass-nav {
      background: rgba(5, 8, 15, 0.8);
      backdrop-filter: blur(20px);
    }
    .light .glass-nav {
      background: rgba(255, 255, 255, 0.9);
    }
    
    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      33% { transform: translate(10px, -20px); }
      66% { transform: translate(-15px, -10px); }
    }
    .float { animation: float 20s ease-in-out infinite; }
    
    @keyframes pulse-subtle {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.25; }
    }
    .pulse-subtle { animation: pulse-subtle 8s ease-in-out infinite; }
    
    @keyframes scan {
      0% { transform: translateY(-100%); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(100vh); opacity: 0; }
    }
    .scan-line {
      position: absolute;
      left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0, 229, 204, 0.5), transparent);
      animation: scan 15s linear infinite;
      pointer-events: none;
    }
    
    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
    .cursor-blink { animation: blink 1s step-end infinite; }
    
    *:focus-visible {
      outline: 2px solid #00e5cc;
      outline-offset: 3px;
    }
    .light *:focus-visible { outline-color: #0d9488; }
    
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, createContext, useContext, useMemo } = React;
    const { motion, AnimatePresence, useScroll, useTransform, useInView } = Motion;

    // Theme Context
    const ThemeContext = createContext();
    const ThemeProvider = ({ children }) => {
      const [isDark, setIsDark] = useState(true);
      useEffect(() => {
        const saved = localStorage.getItem('cyber-learner-theme');
        if (saved !== null) setIsDark(saved === 'dark');
      }, []);
      useEffect(() => {
        document.body.classList.toggle('light', !isDark);
        localStorage.setItem('cyber-learner-theme', isDark ? 'dark' : 'light');
      }, [isDark]);
      return <ThemeContext.Provider value={{ isDark, setIsDark }}>{children}</ThemeContext.Provider>;
    };
    const useTheme = () => useContext(ThemeContext);

    // Typing Effect
    const useTypingEffect = (texts, speed = 50, pause = 3000) => {
      const [displayText, setDisplayText] = useState('');
      const [index, setIndex] = useState(0);
      const [isDeleting, setIsDeleting] = useState(false);
      useEffect(() => {
        const current = texts[index];
        const timeout = setTimeout(() => {
          if (!isDeleting) {
            if (displayText.length < current.length) setDisplayText(current.slice(0, displayText.length + 1));
            else setTimeout(() => setIsDeleting(true), pause);
          } else {
            if (displayText.length > 0) setDisplayText(displayText.slice(0, -1));
            else { setIsDeleting(false); setIndex((prev) => (prev + 1) % texts.length); }
          }
        }, isDeleting ? speed / 2 : speed);
        return () => clearTimeout(timeout);
      }, [displayText, isDeleting, index, texts, speed, pause]);
      return displayText;
    };

    // Data - Learning Journey
    const journeyData = [
      { phase: 'Phase 1', title: 'Foundations', description: 'Understanding the basics of information security, the CIA triad, and fundamental security principles.', topics: ['CIA Triad', 'Security Principles', 'Threat Landscape', 'Risk Basics'], reflection: 'The theoretical foundation helped me understand why security matters beyond just technical skills.' },
      { phase: 'Phase 2', title: 'Networking Essentials', description: 'Learning TCP/IP, common protocols, and how network traffic works at a fundamental level.', topics: ['TCP/IP Model', 'Common Protocols', 'Network Devices', 'Traffic Flow'], reflection: 'Coming from development, I finally understood how my applications actually communicated over networks.' },
      { phase: 'Phase 3', title: 'Security Tools Intro', description: 'Getting hands-on with industry tools for the first time - scanning, capturing, and analyzing.', topics: ['Nmap Basics', 'Wireshark', 'Network Analysis', 'Tool Safety'], reflection: 'The first time I ran an Nmap scan was genuinely exciting. Seeing real network data felt like a new superpower.' },
      { phase: 'Phase 4', title: 'Web Security Basics', description: 'Understanding common web vulnerabilities and how to identify them in applications.', topics: ['OWASP Top 10', 'SQL Injection', 'XSS', 'Security Testing'], reflection: 'My QA background helped me understand that security testing is really just a specialized form of quality testing.' },
      { phase: 'Phase 5', title: 'Practical Exercises', description: 'Applying learned concepts through labs and controlled practice environments.', topics: ['CTF Challenges', 'Lab Environments', 'Documentation', 'Reporting'], reflection: 'Practice made the theory real. I learned that documentation is just as important as the technical work.' },
    ];

    // Data - Tools
    const toolsData = [
      { id: 'nmap', name: 'Nmap', category: 'Network Scanning', description: 'Network discovery and security auditing', color: 'cyan',
        learned: 'I learned how to perform basic network scans, identify open ports, and understand what services might be running. Still learning about more advanced scanning techniques and NSE scripts.',
        challenges: 'The amount of output data was overwhelming at first. I had to learn to filter and interpret results systematically.' },
      { id: 'wireshark', name: 'Wireshark', category: 'Traffic Analysis', description: 'Network protocol analyzer', color: 'teal',
        learned: 'I can now capture network traffic and apply basic filters to analyze packets. Understanding protocol handshakes has been particularly enlightening.',
        challenges: 'Interpreting raw packet data requires deep protocol knowledge. I keep reference guides handy while analyzing.' },
      { id: 'burp', name: 'Burp Suite', category: 'Web Security', description: 'Web application security testing', color: 'amber',
        learned: 'I learned to intercept HTTP requests, understand request/response structures, and identify basic vulnerabilities. The Proxy and Repeater tools are becoming familiar.',
        challenges: 'The number of features can be overwhelming. I started with just the Proxy and gradually explored other tools.' },
      { id: 'linux', name: 'Linux CLI', category: 'Environment', description: 'Command-line operations', color: 'blue',
        learned: 'My development background helped, but security-specific commands and log analysis were new. I\'m comfortable navigating and performing basic security tasks.',
        challenges: 'Remembering the many command options takes practice. I maintain a personal cheat sheet for reference.' },
      { id: 'python', name: 'Python', category: 'Scripting', description: 'Automation and tooling', color: 'coral',
        learned: 'I could apply my existing Python knowledge to write simple automation scripts for security tasks. This is where my developer background really helps.',
        challenges: 'Security-focused Python often requires different libraries and approaches than web development.' },
    ];

    // Data - Projects
    const projectsData = [
      { id: 'network-discovery', title: 'Network Discovery Exercise', subtitle: 'First Hands-on Lab', description: 'My first attempt at mapping a small network using basic scanning techniques.',
        objective: 'Use Nmap to discover live hosts and identify open ports in a controlled lab environment.',
        process: ['Set up the lab environment and documented the scope', 'Ran initial ping scans to identify live hosts', 'Performed port scans on discovered hosts', 'Documented findings with screenshots', 'Researched identified services to understand potential risks'],
        tools: ['Nmap', 'Wireshark', 'Text Editor'],
        observations: 'I discovered 4 live hosts and identified 23 open ports. The scan took longer than expected because I used full port ranges. I learned that targeted scanning is more efficient.',
        lessons: 'Documentation during the process is crucial. I should have been more systematic in my approach rather than jumping between different scan types. Next time, I\'ll create a plan before starting.',
        color: 'cyan' },
      { id: 'web-vuln-basics', title: 'Web Vulnerability Identification', subtitle: 'OWASP Learning Exercise', description: 'Practicing identification of common web vulnerabilities in a deliberately vulnerable application.',
        objective: 'Identify and document at least 3 common web vulnerabilities in the test application.',
        process: ['Set up local testing environment', 'Explored the application to understand functionality', 'Attempted various input manipulation techniques', 'Documented each finding with reproduction steps', 'Researched remediation approaches'],
        tools: ['Burp Suite Community', 'Browser DevTools', 'OWASP Juice Shop'],
        observations: 'Successfully identified SQL injection, stored XSS, and insecure direct object references. The SQL injection was easier to find than expected once I understood the error patterns.',
        lessons: 'My QA testing instincts translated well here - the systematic approach of trying edge cases applies to security testing too. I need to improve my understanding of how to verify findings without causing damage.',
        color: 'amber' },
      { id: 'traffic-capture', title: 'Network Traffic Analysis', subtitle: 'Packet Analysis Introduction', description: 'Capturing and analyzing network traffic to understand normal vs suspicious patterns.',
        objective: 'Capture network traffic and identify at least 5 different protocol types in the capture.',
        process: ['Captured traffic from my own network activity', 'Applied display filters to isolate different protocols', 'Examined TCP handshakes and HTTP requests', 'Attempted to identify anomalies in the captured data', 'Created a summary report of findings'],
        tools: ['Wireshark', 'Tcpdump', 'Documentation'],
        observations: 'Successfully identified DNS, HTTP, HTTPS, TCP, and UDP traffic. Watching a complete TCP handshake in real-time was enlightening. I noticed some unexpected DNS queries that I\'m still investigating.',
        lessons: 'The volume of traffic in even a simple capture is immense. Learning to use filters effectively is essential. I should have captured with specific filters from the start rather than capturing everything.',
        color: 'teal' },
    ];

    // Data - Blog
    const blogData = [
      { id: 'nmap-first-scan', title: 'What I Learned from My First Nmap Scan', excerpt: 'The excitement and confusion of running my first real security tool.', date: '2024-01-20', readTime: '4 min', color: 'cyan',
        content: 'Running my first Nmap scan was a pivotal moment in my learning journey. After reading about network scanning for weeks, actually executing the command felt like crossing a threshold.\n\nI started with a simple `nmap -sV target` on a lab machine. The output was both thrilling and overwhelming. There were open ports I recognized (22, 80, 443) and others I didn\'t. Version detection revealed services I had to research.\n\nThe key lesson? Real network data is messy. Books show clean examples, but real scans have ambiguities, unknowns, and surprises. That\'s what makes this field both challenging and exciting.' },
      { id: 'web-vulns-beginner', title: 'Understanding Web Vulnerabilities as a Beginner', excerpt: 'How my development background helped (and sometimes hindered) learning about web security.', date: '2024-01-15', readTime: '6 min', color: 'amber',
        content: 'Coming from web development, I thought I understood how applications work. Learning about vulnerabilities showed me how much I didn\'t know about how they can be broken.\n\nMy developer mindset initially made me defensive: "I would never write code like that!" But the reality is that vulnerable patterns exist everywhere, often from legitimate business needs or deadline pressures.\n\nThe most valuable perspective shift was understanding that security testing isn\'t about finding faults - it\'s about understanding risk. Every vulnerability I learn about makes me a better developer too.' },
      { id: 'learning-challenges', title: 'Challenges I Faced Learning Cybersecurity', excerpt: 'Honest reflections on the difficulties of transitioning into security.', date: '2024-01-10', readTime: '5 min', color: 'coral',
        content: 'The transition into cybersecurity hasn\'t been smooth. I want to share some honest challenges I\'ve faced, because I think it\'s important to be realistic about this journey.\n\nChallenge 1: Information Overload. There\'s so much to learn that it\'s easy to feel lost. I\'ve had to learn to focus on fundamentals first and accept that I can\'t know everything.\n\nChallenge 2: Imposter Syndrome. This field is full of experts who seem to know everything. I\'ve had to remind myself that they started somewhere too.\n\nChallenge 3: Lab Environments. Setting up proper testing environments was harder than expected. It\'s crucial to have safe spaces to practice.\n\nDespite these challenges, the learning process has been incredibly rewarding.' },
    ];

    // Animated Background
    const AnimatedBackground = () => {
      const particles = useMemo(() => Array.from({ length: 35 }, (_, i) => ({
        id: i, x: Math.random() * 100, y: Math.random() * 100,
        size: 1 + Math.random() * 2, duration: 18 + Math.random() * 15, delay: Math.random() * 10,
      })), []);

      return (
        <div className="fixed inset-0 pointer-events-none z-0 overflow-hidden">
          {/* Grid overlay - dark mode only */}
          <div className="absolute inset-0 opacity-[0.02]"
            style={{ backgroundImage: 'linear-gradient(rgba(0,229,204,0.5) 1px, transparent 1px), linear-gradient(90deg, rgba(0,229,204,0.5) 1px, transparent 1px)', backgroundSize: '70px 70px' }} />
          
          {/* Gradient orbs */}
          <div className="absolute top-0 left-0 w-[800px] h-[800px] -translate-x-1/4 -translate-y-1/4 rounded-full bg-gradient-to-br from-cyber-cyan/8 to-transparent blur-[180px] pulse-subtle" />
          <div className="absolute bottom-0 right-0 w-[600px] h-[600px] translate-x-1/4 translate-y-1/4 rounded-full bg-gradient-to-tl from-cyber-amber/6 to-transparent blur-[150px] pulse-subtle" style={{ animationDelay: '3s' }} />
          <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[900px] h-[500px] rounded-full bg-gradient-to-r from-cyber-teal/5 via-cyber-cyan/5 to-cyber-blue/5 blur-[200px]" />
          
          {/* Floating particles */}
          {particles.map(p => (
            <motion.div key={p.id} className="absolute rounded-full bg-cyber-cyan/50"
              style={{ width: p.size, height: p.size, left: `${p.x}%`, top: `${p.y}%` }}
              animate={{ y: [0, -180, -50, -200, 0], x: [0, 40, -30, 60, 0], opacity: [0.2, 0.5, 0.3, 0.5, 0.2] }}
              transition={{ duration: p.duration, delay: p.delay, repeat: Infinity, ease: 'easeInOut' }} />
          ))}
        </div>
      );
    };

    // Navigation
    const Navigation = ({ currentPage, setCurrentPage }) => {
      const [scrolled, setScrolled] = useState(false);
      const [mobileOpen, setMobileOpen] = useState(false);
      const { isDark, setIsDark } = useTheme();

      useEffect(() => {
        const handleScroll = () => setScrolled(window.scrollY > 50);
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const navItems = [
        { label: 'About', hash: '#about' }, { label: 'Journey', hash: '#journey' },
        { label: 'Tools', hash: '#tools' }, { label: 'Projects', hash: '#projects' },
        { label: 'Blog', hash: '#blog' }, { label: 'Contact', hash: '#contact' },
      ];

      const handleNav = (hash) => {
        if (currentPage !== 'home') { setCurrentPage('home'); setTimeout(() => document.querySelector(hash)?.scrollIntoView({ behavior: 'smooth' }), 100); }
        else { document.querySelector(hash)?.scrollIntoView({ behavior: 'smooth' }); }
        setMobileOpen(false);
      };

      return (
        <>
          <motion.nav initial={{ y: -100 }} animate={{ y: 0 }} className={`fixed top-0 left-0 right-0 z-50 transition-all duration-500 ${scrolled ? 'glass-nav py-3' : 'py-5'}`}>
            <div className="max-w-6xl mx-auto px-6 flex items-center justify-between">
              <motion.button onClick={() => setCurrentPage('home')} className="font-mono text-base font-semibold gradient-text tracking-tight" whileHover={{ scale: 1.05 }}>
                alex@learning:~$               </motion.button>

              <div className="hidden md:flex items-center gap-1">
                {navItems.map(item => (
                  <motion.button key={item.label} onClick={() => handleNav(item.hash)}
                    className="px-4 py-2 text-sm font-medium text-gray-400 hover:text-cyber-cyan transition-colors rounded-lg hover:bg-white/5" whileHover={{ y: -2 }}>
                    {item.label}
                  </motion.button>
                ))}
              </div>

              <div className="flex items-center gap-3">
                <motion.button onClick={() => setIsDark(!isDark)} className="w-9 h-9 rounded-full glass flex items-center justify-center transition-all"
                  whileHover={{ scale: 1.1, rotate: 180 }} whileTap={{ scale: 0.9 }} aria-label="Toggle theme">
                  {isDark ? (
                    <svg className="w-4 h-4 text-cyber-cyan" fill="currentColor" viewBox="0 0 20 20">
                      <path fillRule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clipRule="evenodd" />
                    </svg>
                  ) : (
                    <svg className="w-4 h-4 text-teal-600" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" /></svg>
                  )}
                </motion.button>

                <button className="md:hidden w-9 h-9 flex items-center justify-center text-gray-400" onClick={() => setMobileOpen(true)} aria-label="Menu">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" /></svg>
                </button>
              </div>
            </div>
          </motion.nav>

          <AnimatePresence>
            {mobileOpen && (
              <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="fixed inset-0 z-50 glass flex flex-col">
                <div className="p-6 flex justify-end">
                  <button onClick={() => setMobileOpen(false)} className="w-10 h-10 flex items-center justify-center" aria-label="Close">
                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                  </button>
                </div>
                <div className="flex-1 flex flex-col justify-center items-center gap-6">
                  {navItems.map((item, i) => (
                    <motion.button key={item.label} initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ delay: i * 0.08 }}
                      onClick={() => handleNav(item.hash)} className="text-2xl font-medium hover:text-cyber-cyan transition-colors">{item.label}</motion.button>
                  ))}
                </div>
              </motion.div>
            )}
          </AnimatePresence>
        </>
      );
    };

    // Hero Section
    const Hero = () => {
      const typingText = useTypingEffect(['Learning in progress...', 'Documenting my journey...', 'Growing every day...', 'Curious about security.'], 60, 2500);
      const { scrollY } = useScroll();
      const y = useTransform(scrollY, [0, 500], [0, 150]);
      const opacity = useTransform(scrollY, [0, 400], [1, 0]);

      return (
        <section className="relative min-h-screen flex items-center justify-center overflow-hidden">
          <AnimatedBackground />
          
          <motion.div style={{ y, opacity }} className="relative z-10 text-center px-6 max-w-4xl">
            <motion.div initial={{ opacity: 0, y: 30 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.7 }} className="mb-8">
              <div className="glass rounded-2xl p-6 max-w-md mx-auto relative overflow-hidden">
                <div className="scan-line" />
                <div className="font-mono text-sm">
                  <span className="text-cyber-cyan">$</span>
                  <span className="text-gray-400 ml-2">echo $STATUS</span>
                  <div className="mt-2 text-gray-300">
                    <span className="text-cyber-teal mr-2">{'>'}</span>{typingText}
                    <span className="inline-block w-2 h-4 bg-cyber-cyan ml-1 cursor-blink" />
                  </div>
                </div>
              </div>
            </motion.div>

            <motion.h1 initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.7, delay: 0.1 }} className="text-4xl md:text-6xl lg:text-7xl font-bold mb-4 tracking-tight">
              Alex Chen
            </motion.h1>

            <motion.p initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.7, delay: 0.2 }} className="text-xl md:text-2xl text-gray-300 mb-3 font-light">
              <span className="gradient-text font-medium">Junior Cybersecurity Learner</span>
            </motion.p>

            <motion.p initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.7, delay: 0.3 }} className="text-base text-gray-500 mb-8 max-w-xl mx-auto leading-relaxed">
              Former <span className="gradient-underline font-medium text-gray-400">Fullstack Developer</span> and{' '}
              <span className="gradient-underline font-medium text-gray-400">SQA Engineer</span>.<br />
              Now exploring the world of cybersecurity with curiosity and humility.
            </motion.p>

            <motion.div initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.7, delay: 0.4 }} className="flex flex-wrap gap-3 justify-center">
              <motion.a href="#journey" className="px-6 py-3 bg-gradient-to-r from-cyber-cyan to-cyber-teal text-cyber-dark font-semibold rounded-xl"
                whileHover={{ scale: 1.05, y: -2 }} whileTap={{ scale: 0.95 }}>View My Journey</motion.a>
              <motion.a href="#projects" className="px-6 py-3 border border-cyber-cyan/40 text-cyber-cyan font-medium rounded-xl hover:bg-cyber-cyan/10 transition-all"
                whileHover={{ scale: 1.05, y: -2 }} whileTap={{ scale: 0.95 }}>See Practice Work</motion.a>
            </motion.div>
          </motion.div>

          <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} transition={{ delay: 1.2 }} className="absolute bottom-8 left-1/2 -translate-x-1/2">
            <motion.div animate={{ y: [0, 6, 0] }} transition={{ duration: 2, repeat: Infinity }} className="w-5 h-9 border border-gray-600 rounded-full flex justify-center pt-1.5">
              <div className="w-1 h-1.5 bg-cyber-cyan rounded-full" />
            </motion.div>
          </motion.div>
        </section>
      );
    };

    // About Section
    const About = () => {
      const ref = useRef(null);
      const isInView = useInView(ref, { once: true, margin: '-80px' });

      return (
        <section id="about" className="py-24 px-6 relative">

        <section id="contact" className="py-24 px-6 relative">
          <div className="absolute inset-0 bg-gradient-to-t from-cyber-cyan/5 to-transparent" />
          <div className="max-w-4xl mx-auto relative z-10">
            <motion.div ref={ref} initial={{ opacity: 0, y: 30 }} animate={isInView ? { opacity: 1, y: 0 } : {}} className="text-center mb-8">
              <span className="font-mono text-cyber-cyan text-sm tracking-wide mb-4 block">{'//'} CONNECT</span>
              <h2 className="text-3xl md:text-4xl font-bold mb-3">Get in <span className="gradient-text">Touch</span></h2>
              <p className="text-gray-500 text-sm">Open to conversations about learning, opportunities, or just cybersecurity in general.</p>
            </motion.div>

            <div className="grid md:grid-cols-5 gap-8">
              {/* Form */}
              <motion.div initial={{ opacity: 0, x: -20 }} animate={isInView ? { opacity: 1, x: 0 } : {}} transition={{ delay: 0.2 }} className="md:col-span-3">
                <form onSubmit={handleSubmit} className="space-y-4">
                  <div>
                    <label className="block text-xs font-medium text-gray-400 mb-1.5">Name</label>
                    <input type="text" value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})}
                      className="w-full px-4 py-2.5 glass rounded-lg border-none outline-none focus:glow-soft transition-all bg-transparent text-gray-200 text-sm" placeholder="Your name" required />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-gray-400 mb-1.5">Email</label>
                    <input type="email" value={formData.email} onChange={(e) => setFormData({...formData, email: e.target.value})}
                      className="w-full px-4 py-2.5 glass rounded-lg border-none outline-none focus:glow-soft transition-all bg-transparent text-gray-200 text-sm" placeholder="your@email.com" required />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-gray-400 mb-1.5">Message</label>
                    <textarea value={formData.message} onChange={(e) => setFormData({...formData, message: e.target.value})} rows={4}
                      className="w-full px-4 py-2.5 glass rounded-lg border-none outline-none focus:glow-soft transition-all bg-transparent text-gray-200 resize-none text-sm" placeholder="Your message..." required />
                  </div>
                  <motion.button type="submit" className="w-full px-6 py-3 bg-gradient-to-r from-cyber-cyan to-cyber-teal text-cyber-dark font-semibold rounded-lg text-sm"
                    whileHover={{ scale: 1.02 }} whileTap={{ scale: 0.98 }}>
                    {submitted ? 'Message Sent!' : 'Send Message'}
                  </motion.button>
                </form>
              </motion.div>

              {/* Social Links */}
              <motion.div initial={{ opacity: 0, x: 20 }} animate={isInView ? { opacity: 1, x: 0 } : {}} transition={{ delay: 0.3 }} className="md:col-span-2 space-y-3">
                {[
                  { name: 'GitHub', value: 'github.com/alexchen', icon: <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg> },
                  { name: 'LinkedIn', value: 'linkedin.com/in/alexchen', icon: <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg> },
                  { name: 'Email', value: 'alex.chen@email.com', icon: <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg> },
                ].map((social, i) => (
                  <motion.a key={social.name} href="#" className="glass rounded-lg p-3 flex items-center gap-3 hover:glow-soft transition-all block"
                    whileHover={{ scale: 1.02, x: 4 }}>
                    <span className="text-cyber-cyan">{social.icon}</span>
                    <div>
                      <div className="text-xs text-gray-500">{social.name}</div>
                      <div className="text-gray-300 text-sm">{social.value}</div>
                    </div>
                  </motion.a>
                ))}
              </motion.div>
            </div>

            <motion.div initial={{ opacity: 0 }} animate={isInView ? { opacity: 1 } : {}} transition={{ delay: 0.4 }} className="glass rounded-xl p-5 max-w-lg mx-auto mt-10 text-center">
              <p className="font-mono text-xs text-gray-500 italic">"The more I learn, the more I realize how much I don't know."</p>
            </motion.div>
          </div>
        </section>
      );
    };

    // Footer
    const Footer = () => (
      <footer className="py-6 px-6 border-t border-white/5">
        <div className="max-w-5xl mx-auto flex flex-col md:flex-row items-center justify-between gap-3 text-gray-500 text-xs">
          <span className="font-mono">2024 Alex Chen. Built with React + Tailwind.</span>
          <span className="font-mono"><span className="text-cyber-cyan">$</span> learning = true;</span>
        </div>
      </footer>
    );

    // Main App
    const App = () => {
      const [currentPage, setCurrentPage] = useState('home');
      const [selectedProject, setSelectedProject] = useState(null);
      const [selectedTool, setSelectedTool] = useState(null);
      const [selectedPost, setSelectedPost] = useState(null);

      const handleBack = (section) => {
        setCurrentPage('home');
        setTimeout(() => document.querySelector(section)?.scrollIntoView({ behavior: 'smooth' }), 100);
      };

      const renderPage = () => {
        switch(currentPage) {
          case 'project': return <ProjectDetail project={selectedProject} onBack={() => handleBack('#projects')} />;
          case 'tool': return <ToolDetail tool={selectedTool} onBack={() => handleBack('#tools')} />;
          case 'blog': return <BlogDetail post={selectedPost} onBack={() => handleBack('#blog')} />;
          default: return (
            <>
              <Hero />
              <About />
              <Journey />
              <Tools setCurrentPage={setCurrentPage} setSelectedTool={setSelectedTool} />
              <Projects setCurrentPage={setCurrentPage} setSelectedProject={setSelectedProject} />
              <Blog setCurrentPage={setCurrentPage} setSelectedPost={setSelectedPost} />
              <Contact />
            </>
          );
        }
      };

      return (
        <ThemeProvider>
          <div className="relative bg-cyber-dark text-white min-h-screen">
            <Navigation currentPage={currentPage} setCurrentPage={setCurrentPage} />
            <AnimatePresence mode="wait">
              <motion.main key={currentPage}>{renderPage()}</motion.main>
            </AnimatePresence>
            <Footer />
          </div>
        </ThemeProvider>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
